name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly full-history secret sweep — catches anything committed with
    # --no-verify, which the pre-commit hook cannot.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Deliberately not `pip install -r requirements.txt`: openai-whisper
        # drags in torch (~2GB) and is imported lazily, so the suite never
        # touches it. Keep this list in step with module-level imports.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock ruff requests Pillow PyYAML

      - name: Lint
        run: ruff check .

      # Deliberately no repo-wide `ruff format --check`. 37 files predate the
      # formatter and rewriting them all would bury real history under a
      # whitespace commit. The pre-commit hook formats only files you touch, so
      # the tree converges as it's edited. Turn this into a gate once it's clean.

      - name: Test
        run: pytest tests/ -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
