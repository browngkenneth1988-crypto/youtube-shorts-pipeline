name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The suite mocks the heavy/optional providers (openai-whisper,
        # edge-tts, pytrends, anthropic, google API client) and several tests
        # assert those packages are absent. So CI installs only the lightweight
        # deps the modules import at load time plus the pytest tooling —
        # installing the full runtime set would pull those providers in and
        # break the "provider not installed" tests.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-cov requests Pillow PyYAML feedparser

      - name: Install package (no deps)
        # Doubles as a smoke test that the build backend resolves.
        run: pip install -e . --no-deps

      - name: Run tests with coverage gate
        # addopts in pyproject.toml enforce --cov-fail-under=95.
        run: pytest
