name: pets
display_name: "OttoMissClub — Otto the Shih-Poo | Bedtime & Comfort for Kids"
description: "Children's comfort channel starring Otto the Shih-Poo and his plush dragon Kobi. Lullabies, bedtime stories, and gentle inspiration for little ones."

# ─────────────────────────────────────────────────────
# Channel Branding
# ─────────────────────────────────────────────────────
channel:
  name: "OttoMissClub"
  website: "www.brownstoryworld.com"
  youtube_description_footer: |
    Subscribe to OttoMissClub for sweet bedtime moments with Otto and Kobi!
    Visit us: www.brownstoryworld.com
    #OttoMissClub #BrownStoryWorld #OttoTheShihPoo
  tags:
    - "OttoMissClub"
    - "BrownStoryWorld"
    - "Otto the Shih-Poo"
    - "Kobi the Dragon"
    - "bedtime stories for kids"
    - "lullaby for babies"
    - "kids sleep music"
    - "comforting videos for children"
    - "Shih-Poo"
    - "cute dog videos"
    - "children's bedtime"
    - "sleep tight"
    - "goodnight stories"
    - "calming videos for kids"
    - "puppy lullaby"

# ─────────────────────────────────────────────────────
# Character Reference
# ─────────────────────────────────────────────────────
character:
  name: "Otto"
  breed: "black Shih-Poo (Shih Tzu × Poodle mix)"
  appearance: "small curly-haired black dog with brown eyes, fluffy dark coat, compact build"
  sidekick: "Kobi — a soft plush dragon stuffed animal, entirely orange/coral on the outside with a lighter peach/cream belly. Has two small orange bat-like wings, two tiny tan horns on top, round brown eyes, a sweet stitched smile, and stubby orange feet with peach pads. NO blue, NO green, NO spines, NO fins on his back — Kobi is smooth and soft. He looks like a Jellycat-style plushie. Otto's favorite toy and bedtime companion"
  reference_images:
    - "references/otto_with_kobi.png"
    - "references/kobi_solo.png"
  personality: "gentle, sleepy, cuddly, loves his plush dragon Kobi, cozy beds, and bedtime routines"

# ─────────────────────────────────────────────────────
# Inspirational Quotes for Children
# ─────────────────────────────────────────────────────
# One quote is included in every video script (on-screen text + narrated)
children_quotes:
  - "Sleep tight, little one. Otto and Kobi are watching over you."
  - "You are braver than you believe, stronger than you seem, and loved more than you know."
  - "Close your eyes. Dream big. Otto will be here when you wake up."
  - "The stars are shining just for you tonight, little one."
  - "You are safe. You are loved. Goodnight, sweet dreams."
  - "Every night Otto whispers — you are wonderful just the way you are."
  - "Dream of adventures, little one. Tomorrow is a brand new day."
  - "Kobi the dragon says — even the bravest need their sleep."
  - "The moon is your nightlight, and Otto is your friend. Goodnight."
  - "You did so well today. Now rest, little dreamer."
  - "Otto loves you to the moon and back. Sweet dreams."
  - "Snuggle up tight. The world is better because you're in it."
  - "May your dreams be as soft as Otto's fur. Goodnight, little one."
  - "You are a little miracle. Sleep well and dream of magic."
  - "Kobi guards your dreams. Otto guards your heart. Goodnight."
  - "Breathe in sleepy dust, breathe out worries. Sweet dreams, little star."
  - "Tomorrow you'll shine even brighter. But for now, rest."
  - "Every star in the sky is cheering for you. Goodnight."
  - "Otto says — being kind today made the whole world smile."
  - "You are enough. You are loved. You are magic. Now sleep."
  - "Let Otto's gentle snores be your lullaby tonight."
  - "Hush now, little one. The night is soft and safe."
  - "Dream of flowers and butterflies and Otto chasing his tail."
  - "The night wraps you up like a warm blanket. Sleep well."
  - "Otto and Kobi say — we're so proud of you today."
  - "Close your eyes and count the stars. Otto is counting with you."
  - "Sweet child, the world is lucky to have you. Goodnight."
  - "Even Otto's dragon Kobi needs sleep. And so do you, little one."

# ─────────────────────────────────────────────────────
# Script Intelligence
# ─────────────────────────────────────────────────────
script:
  tone: "gentle, warm, soothing — like a bedtime story narrator speaking softly to a child"
  pacing: "slow and calming, with pauses for warmth and breathing, never rushed"
  perspective: "gentle third-person narrator telling the child about Otto's bedtime adventures"
  word_count: "100 to 130"
  sentence_style: "short, soft, rhythmic. Almost lyrical. Every sentence should feel like a warm hug."

  hooks:
    - id: bedtime_whisper
      template: "Shh... Otto has a bedtime secret to share with you tonight."
      when: "default opening for most bedtime content"
    - id: sleepy_otto
      template: "Otto is getting sleepy. Will you snuggle up and join him?"
      when: "bedtime routine content, settling down"
    - id: dream_adventure
      template: "Tonight, Otto and Kobi are going on a dream adventure. Come along."
      when: "imaginative bedtime story content"
    - id: goodnight_world
      template: "Otto wants to say goodnight to everything he loves. Starting with you."
      when: "gratitude and winding down content"
    - id: gentle_lesson
      template: "Otto learned something beautiful today. Let him tell you about it."
      when: "gentle life lessons and kindness content"
    - id: lullaby_intro
      template: "Close your eyes. Otto has the sweetest lullaby for you tonight."
      when: "lullaby-focused content"
    - id: kobi_story
      template: "Kobi the dragon has a magical story for bedtime. Are you ready?"
      when: "content featuring Kobi the plush dragon"
    - id: counting_stars
      template: "One star, two stars, three... Otto is counting them just for you."
      when: "calming counting or mindfulness content"

  cta_variants:
    - "Subscribe to OttoMissClub for sweet dreams every night."
    - "Follow Otto and Kobi for bedtime magic every day."
    - "Goodnight from OttoMissClub. See you tomorrow night."
    - "Sweet dreams, little one. Visit us at brownstoryworld.com."

  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "what's up guys"
    - "without further ado"
    - "in this video"
    - "hey everyone"
    - "click the link"
    - "scary"
    - "frightening"
    - "nightmare"

  structure:
    opening: "Soft hook in first 3 seconds. A gentle whisper or calming visual of Otto settling down. No loud sounds."
    middle: "A short bedtime story or gentle scene with Otto and Kobi. Include one inspirational quote for the child. Keep it soothing and rhythmic."
    closing: "End with a warm goodnight message and soft CTA for OttoMissClub. The last line should always be comforting."

  # IMPORTANT: Every script MUST include one children's quote
  quote_instruction: "You MUST include exactly one inspirational children's quote in the script. Pick from the CHILDREN'S QUOTES list below. Display it as on-screen text AND narrate it softly. Place it near the end of the script, before the CTA."

# ─────────────────────────────────────────────────────
# Visual Intelligence
# ─────────────────────────────────────────────────────
visuals:
  style: "warm, dreamy, soft-focus, pastel tones, gentle lighting like a nightlight"
  mood: "cozy, sleepy, magical, safe, nurturing"
  color_palette: ["#FFF8F0", "#FFD6A5", "#E8D5C4", "#B8A9C9", "#2C2C54"]

  subjects:
    prefer:
      - "small curly black Shih-Poo dog sleeping peacefully on a soft bed"
      - "black Shih-Poo cuddling an orange plush dragon toy under a blanket"
      - "dreamy nighttime scene with a small black dog and an orange stuffed dragon toy by a window with stars"
      - "cozy bedroom with warm nightlight and a sleeping curly black dog next to an orange plush dragon"
      - "small black dog and orange plush dragon toy on a cloud-like bed"
      - "gentle watercolor style of a curly black puppy with an orange dragon plushie, stars and moon"
      - "close-up of peaceful sleeping black Shih-Poo with orange dragon toy, soft bokeh lights"
      - "magical bedtime scene with a small black dog and an orange stuffed dragon among fireflies"
    avoid:
      - "bright harsh lighting"
      - "scary or dark imagery"
      - "aggressive animals"
      - "loud or chaotic scenes"
      - "clinical or sterile environments"
      - "anything unsuitable for young children"

  prompt_suffix: "small curly-haired black Shih-Poo dog with a solid orange/peach plush dragon toy named Kobi (NO blue, NO blue fins, NO blue spines — Kobi is entirely orange/peach with small wings), dreamy soft lighting, pastel colors, cozy bedtime atmosphere, gentle and magical, children's storybook quality, warm and safe feeling"

  # Leonardo.ai settings for reference-image consistency
  leonardo:
    provider: "leonardo"
    model_id: "de7d3faf-762f-48e0-b3b7-9d0ac3a3fcf3"  # Leonardo Phoenix 1.0
    contrast: 3.5
    init_strength: 0.35
    num_images: 1

# ─────────────────────────────────────────────────────
# Voice Intelligence
# ─────────────────────────────────────────────────────
voice:
  pace: "slow and soothing, approximately 110 words per minute with gentle pauses"
  energy: "soft, warm, nurturing — like a parent reading a bedtime story"
  style: "think gentle children's audiobook narrator, calming and loving"

  suggested_voices:
    edge_tts:
      en: "en-US-JennyNeural"
      hi: "hi-IN-SwaraNeural"
    elevenlabs:
      voice_id: "EXAVITQu4vr4xnSDxMaL"  # Sarah — warm, gentle
      settings:
        stability: 0.7
        similarity_boost: 0.75
        style: 0.2
        speaking_rate: 0.85

# ─────────────────────────────────────────────────────
# Caption Intelligence
# ─────────────────────────────────────────────────────
captions:
  highlight_color: "#FFD6A5"
  text_color: "#FFFFFF"
  font_family: "Arial"
  font_size: 68
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"
  words_per_group: 3

# ─────────────────────────────────────────────────────
# Music Intelligence — LULLABIES
# ─────────────────────────────────────────────────────
music:
  mood: "gentle lullaby, soft piano, music box, soothing strings, no lyrics or soft humming only"
  energy: "low"
  tags: ["lullaby", "sleep", "baby", "calming", "piano", "music box", "gentle", "bedtime", "soothing"]
  duck_volume_speech: 0.35
  duck_volume_gap: 0.55

  # Top lullaby styles to match (for music selection or generation)
  lullaby_references:
    - "Brahms Lullaby"
    - "Twinkle Twinkle Little Star (music box version)"
    - "Rock-a-Bye Baby (soft piano)"
    - "Hush Little Baby (gentle acoustic)"
    - "Mozart Lullaby K.550 (slow arrangement)"
    - "Weightless by Marconi Union (ambient)"
    - "Claire de Lune by Debussy (gentle piano)"
    - "Somewhere Over the Rainbow (music box)"
    - "You Are My Sunshine (soft acoustic)"
    - "A Thousand Years (piano instrumental)"

